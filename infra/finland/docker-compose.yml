
services:
  xui:
    image: ghcr.io/mhsanaei/3x-ui:v3.11.0
    container_name: finland_3xui
    restart: unless-stopped
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "false"
    volumes:
      - xui_data:/etc/x-ui/
    ports:
      - "127.0.0.1:2053:2053"
    expose:
      - "10000"
    tty: true
    networks:
      - finland_network
    sysctls:
      net.ipv4.tcp_congestion_control: bbr
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: finland_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/title-tracker/certs:/etc/nginx/certs:ro
    depends_on:
      - xui
    networks:
      - finland_network
    sysctls:
      net.ipv4.tcp_congestion_control: bbr
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  finland_network:
    driver: bridge

volumes:
  xui_data:
