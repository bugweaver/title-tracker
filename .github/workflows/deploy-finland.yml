
name: Deploy Finland VPN

on:
  push:
    branches:
      - main
    paths:
      - 'infra/finland/**'
      - '.github/workflows/deploy-finland.yml'

  pull_request:
    paths:
      - 'infra/finland/**'
      - '.github/workflows/deploy-finland.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finland-vpn-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Finland configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: |
          docker compose \
            -f infra/finland/docker-compose.yml \
            config --quiet

      - name: Validate Nginx
        run: |
          CERT_DIR="$(mktemp -d)"
          trap 'rm -rf "$CERT_DIR"' EXIT

          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout "$CERT_DIR/origin.key" \
            -out "$CERT_DIR/origin.crt" \
            -days 1 \
            -subj "/CN=fi-edge.titletracker.site" \
            >/dev/null 2>&1

          docker run --rm \
            --add-host xui:127.0.0.1 \
            -v "$PWD/infra/finland/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$CERT_DIR:/etc/nginx/certs:ro" \
            --entrypoint nginx \
            nginx:alpine -t

  deploy:
    name: Deploy to Finland
    runs-on: ubuntu-latest
    needs: validate

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FI_SSH_HOST }}
          username: ${{ secrets.FI_SSH_USERNAME }}
          key: ${{ secrets.FI_SSH_KEY }}
          source: "infra/finland/docker-compose.yml,infra/finland/nginx/default.conf"
          target: "~/title-tracker-finland-release"
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FI_SSH_HOST }}
          username: ${{ secrets.FI_SSH_USERNAME }}
          key: ${{ secrets.FI_SSH_KEY }}
          script: |
            set -eu

            APP_DIR="$HOME/title-tracker-finland"
            RELEASE_DIR="$HOME/title-tracker-finland-release/finland"
            CERT_DIR="/etc/title-tracker/certs"

            mkdir -p "$APP_DIR/nginx"

            echo "1. Checking release files..."

            test -s "$RELEASE_DIR/docker-compose.yml"
            test -s "$RELEASE_DIR/nginx/default.conf"

            echo "2. Checking TLS certificates..."

            test -s "$CERT_DIR/origin.crt"
            test -s "$CERT_DIR/origin.key"

            openssl x509 -in "$CERT_DIR/origin.crt" -noout >/dev/null
            openssl pkey -in "$CERT_DIR/origin.key" -noout -check >/dev/null

            CERT=$(openssl x509 \
              -in "$CERT_DIR/origin.crt" \
              -pubkey -noout |
              openssl pkey -pubin -outform DER |
              sha256sum | awk '{print $1}')

            KEY=$(openssl pkey \
              -in "$CERT_DIR/origin.key" \
              -pubout -outform DER |
              sha256sum | awk '{print $1}')

            test "$CERT" = "$KEY"

            echo "3. Validating Docker Compose..."

            docker compose \
              -p title-tracker-finland \
              --project-directory "$APP_DIR" \
              -f "$RELEASE_DIR/docker-compose.yml" \
              config --quiet

            echo "4. Validating Nginx..."

            docker run --rm \
              --add-host xui:127.0.0.1 \
              -v "$RELEASE_DIR/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
              -v "$CERT_DIR:/etc/nginx/certs:ro" \
              --entrypoint nginx \
              nginx:alpine -t

            echo "5. Installing configuration..."

            install -m 644 \
              "$RELEASE_DIR/docker-compose.yml" \
              "$APP_DIR/docker-compose.yml.new"

            mv -f "$APP_DIR/docker-compose.yml.new" \
              "$APP_DIR/docker-compose.yml"

            install -m 644 \
              "$RELEASE_DIR/nginx/default.conf" \
              "$APP_DIR/nginx/default.conf.new"

            mv -f "$APP_DIR/nginx/default.conf.new" \
              "$APP_DIR/nginx/default.conf"

            echo "6. Pulling images..."

            docker compose \
              -p title-tracker-finland \
              -f "$APP_DIR/docker-compose.yml" \
              pull

            echo "7. Starting services..."

            docker compose \
              -p title-tracker-finland \
              -f "$APP_DIR/docker-compose.yml" \
              up -d --remove-orphans

            echo "8. Checking Nginx..."

            docker exec finland_nginx nginx -t

            echo "9. Deployment successful."

            docker compose \
              -p title-tracker-finland \
              -f "$APP_DIR/docker-compose.yml" \
              ps

            rm -rf "$RELEASE_DIR"
