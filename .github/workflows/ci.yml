name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
            bun-version: latest

      - name: Install dependencies
        run: |
            make install

      - name: Lint
        run: |
            make lint

      - name: Test
        run: |
            make test
      - name: Validate deployment configuration
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          # Compose validation
          touch .env
          docker compose -f docker-compose.deploy.yml config --quiet

          # Generate temporary certificate for Nginx syntax check
          CERT_DIR="$(mktemp -d)"
          trap 'rm -rf "$CERT_DIR"' EXIT

          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout "$CERT_DIR/origin.key" \
            -out "$CERT_DIR/origin.crt" \
            -days 1 \
            -subj "/CN=titletracker.site" \
            >/dev/null 2>&1

          # Validate Nginx configuration
          docker run --rm \
            -v "$PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$CERT_DIR:/etc/nginx/certs:ro" \
            nginx:alpine nginx -t

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Backend
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (tags, labels) for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    concurrency:
      group: title-tracker-production
      cancel-in-progress: false

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Копируем файлы сначала во временную директорию
      - name: Copy files to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.deploy.yml,nginx/default.conf"
          target: "~/title-tracker-release"

      # Проверяем и применяем конфигурацию
      - name: Validate and deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_REPOSITORY_OWNER,GITHUB_ACTOR
          script: |
            set -eu

            APP_DIR="$HOME/title-tracker"
            RELEASE_DIR="$HOME/title-tracker-release"
            CERT_DIR="/etc/title-tracker/certs"

            cd "$APP_DIR"

            echo "1. Checking release files..."

            test -s "$RELEASE_DIR/docker-compose.deploy.yml"
            test -s "$RELEASE_DIR/nginx/default.conf"

            echo "2. Checking TLS certificates..."

            test -s "$CERT_DIR/origin.crt"
            test -s "$CERT_DIR/origin.key"

            openssl x509 \
              -in "$CERT_DIR/origin.crt" \
              -noout >/dev/null

            openssl pkey \
              -in "$CERT_DIR/origin.key" \
              -noout -check >/dev/null

            TMP_DIR="$(mktemp -d)"
            trap 'rm -rf "$TMP_DIR"' EXIT

            openssl x509 \
              -in "$CERT_DIR/origin.crt" \
              -pubkey -noout > "$TMP_DIR/cert.pub"

            openssl pkey \
              -pubin \
              -in "$TMP_DIR/cert.pub" \
              -outform DER \
              -out "$TMP_DIR/cert.der"

            openssl pkey \
              -in "$CERT_DIR/origin.key" \
              -pubout \
              -outform DER \
              -out "$TMP_DIR/key.der"

            cmp -s "$TMP_DIR/cert.der" "$TMP_DIR/key.der"

            echo "Certificate and private key are valid."

            echo "3. Validating Docker Compose..."

            docker compose \
              --project-directory "$APP_DIR" \
              --env-file "$APP_DIR/.env" \
              -f "$RELEASE_DIR/docker-compose.deploy.yml" \
              config --quiet

            echo "4. Validating Nginx..."

            docker run --rm \
              -v "$RELEASE_DIR/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
              -v "$CERT_DIR:/etc/nginx/certs:ro" \
              nginx:alpine nginx -t

            echo "5. Logging in to GHCR..."

            printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io \
              -u "$GITHUB_ACTOR" \
              --password-stdin

            echo "6. Pulling images..."

            docker compose \
              --project-directory "$APP_DIR" \
              --env-file "$APP_DIR/.env" \
              -f "$RELEASE_DIR/docker-compose.deploy.yml" \
              pull

            echo "7. Backing up current configuration..."

            BACKUP_DIR="$(mktemp -d "$APP_DIR/.deploy-backup.XXXXXX")"

            cp -p "$APP_DIR/docker-compose.deploy.yml" \
              "$BACKUP_DIR/docker-compose.deploy.yml"

            cp -p "$APP_DIR/nginx/default.conf" \
              "$BACKUP_DIR/default.conf"

            echo "8. Installing new configuration..."

            install -m 644 \
              "$RELEASE_DIR/docker-compose.deploy.yml" \
              "$APP_DIR/docker-compose.deploy.yml.new"

            mv -f \
              "$APP_DIR/docker-compose.deploy.yml.new" \
              "$APP_DIR/docker-compose.deploy.yml"

            install -m 644 \
              "$RELEASE_DIR/nginx/default.conf" \
              "$APP_DIR/nginx/default.conf.new"

            mv -f \
              "$APP_DIR/nginx/default.conf.new" \
              "$APP_DIR/nginx/default.conf"

            rollback() {
              echo "Deployment failed. Restoring previous configuration..."

              cp -p "$BACKUP_DIR/docker-compose.deploy.yml" \
                "$APP_DIR/docker-compose.deploy.yml"

              cp -p "$BACKUP_DIR/default.conf" \
                "$APP_DIR/nginx/default.conf"

              docker compose -f "$APP_DIR/docker-compose.deploy.yml" \
                up -d nginx || true

              docker compose -f "$APP_DIR/docker-compose.deploy.yml" \
                exec -T nginx nginx -t &&
              docker compose -f "$APP_DIR/docker-compose.deploy.yml" \
                exec -T nginx nginx -s reload || true
            }

            echo "9. Starting services..."

            if ! docker compose -f docker-compose.deploy.yml \
              up -d --remove-orphans; then
              rollback
              exit 1
            fi

            echo "10. Checking running Nginx..."

            if ! docker compose -f docker-compose.deploy.yml \
              exec -T nginx nginx -t; then
              rollback
              exit 1
            fi

            if ! docker compose -f docker-compose.deploy.yml \
              exec -T nginx nginx -s reload; then
              rollback
              exit 1
            fi

            echo "11. Deployment successful."

            docker compose -f docker-compose.deploy.yml ps

            rm -rf "$BACKUP_DIR"
            rm -rf "$RELEASE_DIR"

            docker image prune -f
